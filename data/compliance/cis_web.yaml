name: CIS Web Server Benchmark
version: 1.0
checks:
  - id: 1.1
    title: HTTP Security Headers
    description: Server должен отправлять security headers
    severity: medium
    check:
      type: header_present
      header: Strict-Transport-Security
  - id: 1.2
    title: X-Content-Type-Options
    description: Защита от MIME-sniffing
    severity: low
    check:
      type: header_present
      header: X-Content-Type-Options
      value: nosniff
  - id: 1.3
    title: X-Frame-Options
    description: Защита от clickjacking
    severity: medium
    check:
      type: header_present
      header: X-Frame-Options
  - id: 1.4
    title: Content-Security-Policy
    description: CSP для XSS защиты
    severity: medium
    check:
      type: header_present
      header: Content-Security-Policy
  - id: 1.5
    title: Referrer-Policy
    description: Контроль referer
    severity: low
    check:
      type: header_present
      header: Referrer-Policy
  - id: 1.6
    title: Server header не должен раскрывать версию
    description: Server не содержит версии
    severity: low
    check:
      type: header_not_contains
      header: Server
      pattern: "[0-9]\\.[0-9]"
  - id: 2.1
    title: HTTPS обязателен
    description: HTTP должен редиректить на HTTPS
    severity: high
    check:
      type: https_redirect
  - id: 2.2
    title: Cookie Secure flag
    description: Cookies должны иметь Secure
    severity: high
    check:
      type: cookie_secure
  - id: 2.3
    title: Cookie HttpOnly
    description: Cookies должны иметь HttpOnly
    severity: medium
    check:
      type: cookie_httponly
  - id: 2.4
    title: Cookie SameSite
    description: Cookies должны иметь SameSite
    severity: low
    check:
      type: cookie_samesite
  - id: 3.1
    title: Нет directory listing
    description: Отсутствует листинг директорий
    severity: medium
    check:
      type: body_not_contains
      path: /uploads/
      pattern: "Index of /"
  - id: 3.2
    title: Нет утечки .git
    description: /.git/config недоступен
    severity: high
    check:
      type: path_status
      path: /.git/config
      expected_not: 200
  - id: 3.3
    title: Нет утечки .env
    description: /.env недоступен
    severity: critical
    check:
      type: path_status
      path: /.env
      expected_not: 200
  - id: 3.4
    title: Нет phpinfo
    description: /phpinfo.php недоступен
    severity: medium
    check:
      type: path_status
      path: /phpinfo.php
      expected_not: 200
  - id: 4.1
    title: Нет X-Powered-By
    description: Заголовок не должен раскрывать технологию
    severity: low
    check:
      type: header_absent
      header: X-Powered-By
  - id: 4.2
    title: Нет default error pages
    description: Кастомная 404
    severity: low
    check:
      type: custom_404
